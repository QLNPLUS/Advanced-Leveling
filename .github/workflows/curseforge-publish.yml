name: Build and publish Forge 1.19.2 mod

on:
  push:
    branches: [forge-1.19.2]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified jar to CurseForge
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CURSEFORGE_PROJECT_ID: '1650366'
  GAME_VERSION: '1.19.2'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | head -n1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Verify the adapted release and record its hash
        env:
          MOD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          jar="build/forge119-release/advanced-leveling-forge-1.19.2-${MOD_VERSION}-all.jar"
          test -f "$jar"
          test -s build/forge119-release/release.json
          recorded="$(python3 -c "import json;print(json.load(open('build/forge119-release/release.json'))['sha256'])")"
          computed="$(sha256sum "$jar" | awk '{print $1}')"
          test "$recorded" = "$computed"
          printf '%s  %s\n' "$computed" "$jar" > build/release-jar.sha256
          test -s build/release-jar.sha256

      - name: Prepare current changelog
        env:
          MOD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          awk -v version="$MOD_VERSION" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Preserve build outputs, packaging proof, tests and changelog
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-build-${{ steps.version.outputs.value }}
          path: |
            build/forge119-release/**
            build/forge119-compatible-lib/**
            build/release-jar.sha256
            build/curseforge-changelog.md
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    concurrency:
      group: curseforge-advanced-leveling-forge-1.19.2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download exactly the jar built by this run
        uses: actions/download-artifact@v4
        with:
          name: forge-1.19.2-build-${{ needs.build.outputs.version }}
          path: build

      - name: Verify the downloaded jar matches the recorded hash
        env:
          MOD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/forge119-release/advanced-leveling-forge-1.19.2-${MOD_VERSION}-all.jar"
          test -f "$jar"
          recorded="$(awk 'NR==1{print $1}' build/release-jar.sha256)"
          computed="$(sha256sum "$jar" | awk '{print $1}')"
          test -n "$recorded"
          test "$recorded" = "$computed"
          # The release must be the adapted packaging, never the canonical library hash.
          test -s build/forge119-release/release.json
          python3 - "$jar" <<'PY'
          import json
          import sys

          release = json.load(open("build/forge119-release/release.json", encoding="utf-8"))
          wrapper = json.load(open("build/forge119-compatible-lib/compatibility.json", encoding="utf-8"))
          assert release["nestedLibrarySha256"] == wrapper["wrapper"]["sha256"]
          assert release["canonicalSha256"] == wrapper["canonical"]["sha256"]
          assert release["nestedLibrarySha256"] != release["canonicalSha256"]
          print("release nests the Forge 43 wrapper", release["nestedLibrarySha256"])
          PY
          echo "RELEASE_JAR=$jar" >> "$GITHUB_ENV"
          echo "RELEASE_JAR_SHA256=$computed" >> "$GITHUB_ENV"

      - name: Publish to CurseForge
        id: curseforge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.RELEASE_JAR }}
          version: ${{ needs.build.outputs.version }}
          name: advanced-leveling-forge-1.19.2-${{ needs.build.outputs.version }}-all
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.19.2
          java: 17
          retry-attempts: 1

      - name: Write CurseForge receipt
        if: always()
        env:
          CF_OUTCOME: ${{ steps.curseforge.outcome }}
          CF_VERSION_OUTPUT: ${{ steps.curseforge.outputs.curseforge-version }}
          CF_FILES_OUTPUT: ${{ steps.curseforge.outputs.curseforge-files }}
          CF_URL_OUTPUT: ${{ steps.curseforge.outputs.curseforge-url }}
          CF_PROJECT_OUTPUT: ${{ steps.curseforge.outputs.curseforge-id }}
          JAR_SHA256: ${{ env.RELEASE_JAR_SHA256 }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - build/curseforge-receipt.json <<'PY'
          import json
          import os
          import sys

          target = sys.argv[1]

          def load_files(raw):
              if not raw or not raw.strip():
                  return []
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError:
                  return []
              if isinstance(value, dict):
                  value = [value]
              if not isinstance(value, list):
                  return []
              files = []
              for item in value:
                  if not isinstance(item, dict):
                      continue
                  files.append({
                      "file_id": item.get("id"),
                      "name": item.get("name"),
                      "display_name": item.get("displayName"),
                      "url": item.get("url"),
                  })
              return files

          project_output = os.environ.get("CF_PROJECT_OUTPUT") or ""
          receipt = {
              "schema": "advancedleveling.curseforge-receipt.v1",
              "project": {
                  "curseforge_project_id": int(os.environ["CURSEFORGE_PROJECT_ID"]),
                  "action_project_output": int(project_output) if project_output.isdigit() else project_output,
              },
              "run": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "workflow": os.environ.get("GITHUB_WORKFLOW"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "source_sha": os.environ.get("GITHUB_SHA"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "event": os.environ.get("GITHUB_EVENT_NAME"),
              },
              "artifact": {
                  "name": os.environ.get("RELEASE_JAR"),
                  "sha256": os.environ.get("JAR_SHA256") or None,
                  "version": os.environ.get("MOD_VERSION"),
                  "loader": "forge",
                  "game_version": "1.19.2",
                  "java": 17,
              },
              "upload": {
                  "outcome": os.environ.get("CF_OUTCOME"),
                  "curseforge_version_output": os.environ.get("CF_VERSION_OUTPUT") or None,
                  "curseforge_url_output": os.environ.get("CF_URL_OUTPUT") or None,
                  "files": load_files(os.environ.get("CF_FILES_OUTPUT")),
              },
              "notes": [
                  "file ids are taken from curseforge-files; the project output is never used as a file id",
                  "an uncertain upload response is recorded as-is and is never retried automatically",
                  "the uploaded jar nests the derived Forge 43 wrapper, not the canonical upstream jar",
              ],
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          test -s build/curseforge-receipt.json

      - name: Preserve the CurseForge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-receipt-forge-1.19.2-${{ needs.build.outputs.version }}-run${{ github.run_id }}
          path: build/curseforge-receipt.json
          if-no-files-found: warn
          retention-days: 30
