name: Publish Forge 1.20.1 mod

on:
  push:
    branches: [forge-1.20.1]
  workflow_dispatch:
    inputs:
      version:
        description: Mod version to publish
        required: true
        default: 1.0.2
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || '1.0.2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: curseforge-advanced-leveling-forge-1.20.1-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Normalize release version
        run: |
          version="${RELEASE_VERSION#v}"
          test -n "$version"
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Verify artifact
        run: |
          expected="advanced-leveling-forge-1.20.1-${CURSEFORGE_VERSION}-all.jar"
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=build/libs/$expected" >> "$GITHUB_ENV"
      - name: Prepare current changelog
        run: |
          awk -v version="$CURSEFORGE_VERSION" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: advanced-leveling-forge-1.20.1-${{ env.CURSEFORGE_VERSION }}-all
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17
