name: Build, test and publish NeoForge 1.21.1 mod

# An ordinary push builds and tests only: no publication credentials are available to it, so it
# cannot upload by accident. Publishing requires either an exact version tag (v<mod_version>) or an
# explicit `publish` choice on a manual run. The version always comes from gradle.properties.
on:
  push:
    branches: [neoforge-1.21.1]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built jar to CurseForge
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-advanced-leveling-neoforge-1.21.1-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tail -n 1)"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v${MOD_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Verify artifact
        run: |
          expected="advanced-leveling-neoforge-1.21.1-${MOD_VERSION}.jar"
          test -f "build/libs/$expected"
          echo "MOD_FILE=$expected" >> "$GITHUB_ENV"
      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-leveling-neoforge-1.21.1-${{ env.MOD_VERSION }}
          path: build/libs/${{ env.MOD_FILE }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    concurrency:
      group: curseforge-advanced-leveling-neoforge-1.21.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tail -n 1)"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v${MOD_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"
      - name: Fetch built artifact
        uses: actions/download-artifact@v4
        with:
          name: advanced-leveling-neoforge-1.21.1-${{ env.MOD_VERSION }}
          path: build/libs
      - name: Verify artifact
        run: |
          expected="build/libs/advanced-leveling-neoforge-1.21.1-${MOD_VERSION}.jar"
          test -f "$expected"
          echo "MOD_FILE=$expected" >> "$GITHUB_ENV"
      - name: Prepare current changelog
        run: |
          mkdir -p build
          awk -v version="$MOD_VERSION" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.MOD_FILE }}
          version: ${{ env.MOD_VERSION }}
          name: advanced-leveling-neoforge-1.21.1-${{ env.MOD_VERSION }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
