buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_file_name}-forge-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ---------------------------------------------------------------------------------------------
// YiRanExpressionLib: one pinned binary, one allowed source.
//
// This branch used to resolve the library from JitPack with a 62894 byte archive under the
// `1.0.1` coordinate. The canonical build shipped by the NeoForge 1.21.1 branch is the official
// JitPack `universal` build of upstream commit 60584101e698d1e3f79d327b18982dec7ddb5465, pinned
// here by size and SHA-256. Byte identity is not a license conclusion: the library keeps its own
// LGPL v3.0 terms.
//
// Consequences enforced by the tasks at the bottom of this file:
//   * the coordinate is declared as Gradle exclusive content of the local `libs/maven` repository,
//     so no other repository is searched for it and there is no JitPack fallback,
//   * a missing or edited local artifact fails the build instead of silently changing binaries,
//   * the packaged jar nests exactly one library and those bytes are the pinned ones.
// ---------------------------------------------------------------------------------------------
def expressionLibGroup = 'com.github.yiran1457'
def expressionLibArtifact = 'YiRanExpressionLib'
def expressionLibVersion = '1.0.1'
def expressionLibRange = '[1.0.1]'
def expressionLibModId = 'yiranexpressionlib'
def expressionLibLicense = 'LGPL v3.0'
def expressionLibBytes = 62897L
def expressionLibSha256 = 'd797d9eaf22923b5f0d0d152b583aef3d60600bf349aa481a89ecd159255106a'
def expressionLibNotation = "${expressionLibGroup}:${expressionLibArtifact}:${expressionLibVersion}"
def expressionLibDir = "libs/maven/${expressionLibGroup.replace('.', '/')}/${expressionLibArtifact}/${expressionLibVersion}"
def expressionLibFile = file("${expressionLibDir}/${expressionLibArtifact}-${expressionLibVersion}.jar")
def expressionLibPom = file("${expressionLibDir}/${expressionLibArtifact}-${expressionLibVersion}.pom")
def expressionLibNestedPath = "META-INF/jarjar/${expressionLibArtifact}-${expressionLibVersion}.jar"
def expressionLibMetadataPath = 'META-INF/jarjar/metadata.json'
def expressionLibDescriptors = ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Test-only probe sourceset used by the dedicated-server smoke check. It is never part of the mod
// jar and is loaded as a separate mod by the `runServer` smoke invocation only.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true

    // When true, this property will have all IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file(providers.systemProperty('autoleveling.smoke.dir').getOrElse('run'))

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                autoleveling_smoke {
                    source sourceSets.smoke
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

jarJar.enable()

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Gradle-exclusive source for the pinned library module: no other repository is even asked for
    // `com.github.yiran1457:YiRanExpressionLib`, so a missing or tampered local module fails the
    // resolution instead of falling through to JitPack or anywhere else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'localBundledLibraries'
                url = layout.projectDirectory.dir('libs/maven')
            }
        }
        filter { includeModule expressionLibGroup, expressionLibArtifact }
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations {
    // Resolvable view of the same coordinate, used only by the library gate below.
    expressionLibResolution {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    def expressionLib = implementation(expressionLibNotation)
    jarJar(expressionLib)
    jarJar.ranged(expressionLib, expressionLibRange)
    jarJar.pin(expressionLib, expressionLibVersion)
    expressionLibResolution(expressionLibNotation) { transitive = false }
    // jade
	implementation fg.deobf("curse.maven:jade-324717:4573194")
    // neat
    implementation fg.deobf("curse.maven:neat-238372:4580940")
    // infernal mobs
    implementation fg.deobf("curse.maven:atomicstrykers-infernal-mobs-227875:4882078")
    // attribute fix
    implementation fg.deobf("curse.maven:attributefix-280510:4648448")
    // max health fix
    implementation fg.deobf("curse.maven:max-health-fix-492246:4648479")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The JUnit sourceset runs against the same Minecraft/Forge classes as the mod, so the read-only API
// rules and the attribute value modes are exercised without starting a client or a server.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure { useJUnitPlatform() }

mixin {
    add sourceSets.main, 'autoleveling.refmap.json'
    config 'autoleveling.mixins.json'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jarJar') {
    from(rootProject.file('licenses/YiRanExpressionLib-LICENSE.txt')) {
        into 'META-INF/licenses/yiran-expression-lib'
    }
}

// ---------------------------------------------------------------------------------------------
// Library gates. See the pinned facts above; these tasks only report what the bytes are.
// ---------------------------------------------------------------------------------------------
def sha256Hex = { byte[] data ->
    java.security.MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString()
}

def verifyExpressionLibArtifact = tasks.register('verifyExpressionLibArtifact') {
    description = 'Checks that the bundled YiRanExpressionLib artifact and POM are the pinned ones.'
    group = 'verification'
    inputs.file(expressionLibFile)
    inputs.file(expressionLibPom)
    doLast {
        if (!expressionLibFile.isFile()) {
            throw new GradleException("missing bundled library artifact ${expressionLibDir}/${expressionLibFile.name}; " +
                    'the build must not fall back to a different remote package')
        }
        byte[] data = expressionLibFile.bytes
        if (data.length != expressionLibBytes || sha256Hex(data) != expressionLibSha256) {
            throw new GradleException("${expressionLibFile.name} is not the official " +
                    "${expressionLibArtifact}-${expressionLibVersion} universal build " +
                    "(${data.length} bytes, sha256 ${sha256Hex(data)}); expected ${expressionLibBytes} bytes, " +
                    "sha256 ${expressionLibSha256}")
        }
        def pom = new groovy.xml.XmlSlurper(false, false).parse(expressionLibPom)
        def identity = [pom.groupId.text(), pom.artifactId.text(), pom.version.text(), pom.packaging.text()]
        if (identity != [expressionLibGroup, expressionLibArtifact, expressionLibVersion, 'jar']) {
            throw new GradleException("${expressionLibPom.name} declares ${identity}; expected " +
                    "[${expressionLibGroup}, ${expressionLibArtifact}, ${expressionLibVersion}, jar]")
        }
    }
}

def verifyExpressionLibResolution = tasks.register('verifyExpressionLibResolution') {
    description = 'Checks that the library coordinate resolves from the pinned local artifact only.'
    group = 'verification'
    dependsOn verifyExpressionLibArtifact
    def resolved = configurations.expressionLibResolution.incoming.artifactView { it.lenient(false) }.files
    doLast {
        Set<File> files = resolved.files
        if (files.size() != 1) {
            throw new GradleException("${expressionLibNotation} must resolve to exactly one file, got ${files}")
        }
        File resolvedFile = files.first()
        if (resolvedFile.canonicalFile != expressionLibFile.canonicalFile) {
            throw new GradleException("${expressionLibNotation} resolved to ${resolvedFile} instead of the " +
                    "pinned ${expressionLibFile}; the build must not resolve this library from elsewhere")
        }
    }
}

def verifyPackagedExpressionLib = tasks.register('verifyPackagedExpressionLib') {
    description = 'Checks the packaged mod jar nests exactly one library and those bytes are the pinned ones.'
    group = 'verification'
    def jarJarTask = tasks.named('jarJar')
    dependsOn jarJarTask
    inputs.file(jarJarTask.flatMap { it.archiveFile })
    doLast {
        File packaged = jarJarTask.get().archiveFile.get().asFile
        if (!packaged.isFile()) {
            throw new GradleException("the jarJar output ${packaged} does not exist")
        }
        new java.util.zip.ZipFile(packaged).withCloseable { archive ->
            List<String> names = archive.entries().collect { it.name }
            [expressionLibMetadataPath, expressionLibNestedPath].each { required ->
                int count = names.count { it == required }
                if (count != 1) {
                    throw new GradleException("${required} must appear exactly once in ${packaged.name}, found ${count}")
                }
            }
            List<String> nested = names.findAll { it.startsWith('META-INF/jarjar/') && it.endsWith('.jar') }.sort()
            if (nested != [expressionLibNestedPath]) {
                throw new GradleException("exactly one nested JAR ${expressionLibNestedPath} is allowed, found ${nested}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry(expressionLibMetadataPath)))
            if (!(metadata.jars instanceof List) || metadata.jars.size() != 1) {
                throw new GradleException('JarJar metadata must contain exactly one nested library entry')
            }
            def entry = metadata.jars[0]
            def identifier = entry.identifier ?: [:]
            def libraryVersion = entry.version ?: [:]
            if (identifier.group != expressionLibGroup || identifier.artifact != expressionLibArtifact) {
                throw new GradleException("JarJar identity must be ${expressionLibNotation}, got ${identifier}")
            }
            if (libraryVersion.range != expressionLibRange || libraryVersion.artifactVersion != expressionLibVersion) {
                throw new GradleException("JarJar version must be range ${expressionLibRange} / ${expressionLibVersion}, " +
                        "got ${libraryVersion}")
            }
            if (entry.path != expressionLibNestedPath) {
                throw new GradleException("JarJar path must be ${expressionLibNestedPath}, got ${entry.path}")
            }
            byte[] nestedBytes = archive.getInputStream(archive.getEntry(expressionLibNestedPath)).bytes
            if (nestedBytes.length != expressionLibBytes || sha256Hex(nestedBytes) != expressionLibSha256) {
                throw new GradleException("nested ${expressionLibNestedPath} is not the pinned build " +
                        "(${nestedBytes.length} bytes, sha256 ${sha256Hex(nestedBytes)})")
            }
            new java.util.zip.ZipInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nestedJar ->
                Map<String, String> descriptors = [:]
                for (def entryStream = nestedJar.nextEntry; entryStream != null; entryStream = nestedJar.nextEntry) {
                    if (expressionLibDescriptors.contains(entryStream.name)) {
                        ByteArrayOutputStream text = new ByteArrayOutputStream()
                        byte[] chunk = new byte[8192]
                        for (int read = nestedJar.read(chunk); read > 0; read = nestedJar.read(chunk)) {
                            text.write(chunk, 0, read)
                        }
                        descriptors[entryStream.name] = text.toString('UTF-8')
                    }
                }
                String modsToml = descriptors['META-INF/mods.toml']
                if (modsToml == null) {
                    throw new GradleException('nested library is missing META-INF/mods.toml')
                }
                [modId: expressionLibModId, version: expressionLibVersion, license: expressionLibLicense].each { key, value ->
                    if (!modsToml.contains("${key}=\"${value}\"")) {
                        throw new GradleException("nested META-INF/mods.toml does not declare ${key}=\"${value}\"")
                    }
                }
            }
        }
    }
}

// The smoke probe is a test-only mod; it must never end up in the distributable jar.
def verifyNoProbeClassesInJar = tasks.register('verifyNoProbeClassesInJar') {
    description = 'Checks that the distributable jar contains no smoke-probe classes.'
    group = 'verification'
    def jarJarTask = tasks.named('jarJar')
    dependsOn jarJarTask
    doLast {
        File packaged = jarJarTask.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(packaged).withCloseable { archive ->
            List<String> probeEntries = archive.entries()
                    .collect { it.name }
                    .findAll { it.startsWith('daripher/autoleveling/smoke/') || it == 'META-INF/autoleveling_smoke.mods.toml' }
            if (!probeEntries.isEmpty()) {
                throw new GradleException("the distributable jar contains smoke-probe entries: ${probeEntries}")
            }
        }
    }
}

tasks.named('check') { dependsOn verifyExpressionLibResolution }
tasks.named('build') { dependsOn verifyPackagedExpressionLib, verifyNoProbeClassesInJar }
