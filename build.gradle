plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_file_name}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/generated/resources' }
// The NeoForge 1.21.1 implementation lives in src/main/java. Compile the
// complete implementation so entity events, config reloaders, saved data and
// KubeJS-facing APIs are included in the NeoForge artifact.
sourceSets.main.java.setSrcDirs(['src/main/java'])
// NeoForge 1.21.1 replaced the legacy SimpleChannel API. The old optional
// packet shim was never used by the leveling logic and is excluded until a
// payload-based client sync is needed.
sourceSets.main.java.exclude('daripher/autoleveling/network/**')

// ---------------------------------------------------------------------------------------------
// YiRanExpressionLib: one pinned binary, one allowed source.
//
// The distributable artifact nests this library, so which binary is inside has to be provable.
// The Maven identity below has always been `1.0.1`, but a coordinate alone never proves which
// bytes it refers to: JitPack can rebuild the same tag, and this repository previously shipped a
// different 62894 byte archive under this exact coordinate. The nested library is therefore the
// official JitPack `universal` build of upstream commit 60584101e698d1e3f79d327b18982dec7ddb5465,
// pinned by size and SHA-256, and the same artifact and gate the Tactical RPG project uses.
//
// Consequences enforced by the tasks at the bottom of this file:
//   * the coordinate is declared as Gradle exclusive content of the local `libs/maven` repository,
//     so no other repository is searched for it and there is no JitPack fallback,
//   * a missing or edited local artifact fails the build instead of silently changing binaries,
//   * the packaged jar nests exactly one library and those bytes are the pinned ones.
// Byte identity is not a license conclusion: the library keeps its own LGPL v3.0 terms.
// ---------------------------------------------------------------------------------------------
def expressionLibGroup = 'com.github.yiran1457'
def expressionLibArtifact = 'YiRanExpressionLib'
def expressionLibVersion = '1.0.1'
def expressionLibRange = '[1.0.1]'
def expressionLibModId = 'yiranexpressionlib'
def expressionLibLicense = 'LGPL v3.0'
def expressionLibBytes = 62897L
def expressionLibSha256 = 'd797d9eaf22923b5f0d0d152b583aef3d60600bf349aa481a89ecd159255106a'
def expressionLibNotation = "${expressionLibGroup}:${expressionLibArtifact}:${expressionLibVersion}"
def expressionLibDir = "libs/maven/${expressionLibGroup.replace('.', '/')}/${expressionLibArtifact}/${expressionLibVersion}"
def expressionLibFile = file("${expressionLibDir}/${expressionLibArtifact}-${expressionLibVersion}.jar")
def expressionLibPom = file("${expressionLibDir}/${expressionLibArtifact}-${expressionLibVersion}.pom")
def expressionLibNestedPath = "META-INF/jarjar/${expressionLibArtifact}-${expressionLibVersion}.jar"
def expressionLibMetadataPath = 'META-INF/jarjar/metadata.json'
def expressionLibDescriptors = ['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']

repositories {
    // Gradle-exclusive source for the pinned library module: no other repository is even asked for
    // `com.github.yiran1457:YiRanExpressionLib`, so a missing or tampered local module fails the
    // resolution instead of falling through to JitPack or anywhere else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'localBundledLibraries'
                url = layout.projectDirectory.dir('libs/maven')
            }
        }
        filter { includeModule expressionLibGroup, expressionLibArtifact }
    }
}

repositories { maven { url = 'https://api.modrinth.com/maven' } }

repositories { maven { url 'https://jitpack.io' } }

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
    // Run the plain JUnit sourceset in src/test/java against Minecraft and this mod's classes.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Resolvable view of the same coordinate, used only by the library gate below.
    expressionLibResolution {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

dependencies {
    def expressionLib = implementation(expressionLibNotation)
    jarJar(expressionLib) {
        version {
            strictly expressionLibRange
            prefer expressionLibVersion
        }
    }
    expressionLibResolution(expressionLibNotation)
    compileOnly(files('libs/Jade-1.21.1-NeoForge-15.10.6.jar'))

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url "file://${project.projectDir}/mcmodsrepo" } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    from(rootProject.file('licenses/YiRanExpressionLib-LICENSE.txt')) {
        into 'META-INF/licenses/yiran-expression-lib'
    }
}

// ---------------------------------------------------------------------------------------------
// Library gates. See the pinned facts above; these tasks only report what the bytes are.
// ---------------------------------------------------------------------------------------------
def sha256Hex = { byte[] data ->
    java.security.MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString()
}

def verifyExpressionLibArtifact = tasks.register('verifyExpressionLibArtifact') {
    description = 'Checks that the bundled YiRanExpressionLib artifact and POM are the pinned ones.'
    group = 'verification'
    inputs.file(expressionLibFile)
    inputs.file(expressionLibPom)
    doLast {
        if (!expressionLibFile.isFile()) {
            throw new GradleException("missing bundled library artifact ${expressionLibDir}/${expressionLibFile.name}; " +
                    'the build must not fall back to a different remote package')
        }
        byte[] data = expressionLibFile.bytes
        if (data.length != expressionLibBytes || sha256Hex(data) != expressionLibSha256) {
            throw new GradleException("${expressionLibFile.name} is not the official " +
                    "${expressionLibArtifact}-${expressionLibVersion} universal build " +
                    "(${data.length} bytes, sha256 ${sha256Hex(data)}); expected ${expressionLibBytes} bytes, " +
                    "sha256 ${expressionLibSha256}")
        }
        def pom = new groovy.xml.XmlSlurper(false, false).parse(expressionLibPom)
        def identity = [pom.groupId.text(), pom.artifactId.text(), pom.version.text(), pom.packaging.text()]
        if (identity != [expressionLibGroup, expressionLibArtifact, expressionLibVersion, 'jar']) {
            throw new GradleException("${expressionLibPom.name} declares ${identity}; expected " +
                    "[${expressionLibGroup}, ${expressionLibArtifact}, ${expressionLibVersion}, jar]")
        }
    }
}

def verifyExpressionLibResolution = tasks.register('verifyExpressionLibResolution') {
    description = 'Checks that the library coordinate resolves from the pinned local artifact only.'
    group = 'verification'
    dependsOn verifyExpressionLibArtifact
    def resolved = configurations.expressionLibResolution.incoming.artifactView { it.lenient(false) }.files
    doLast {
        Set<File> files = resolved.files
        if (files.size() != 1) {
            throw new GradleException("${expressionLibNotation} must resolve to exactly one file, got ${files}")
        }
        File resolvedFile = files.first()
        if (resolvedFile.canonicalFile != expressionLibFile.canonicalFile) {
            throw new GradleException("${expressionLibNotation} resolved to ${resolvedFile} instead of the " +
                    "pinned ${expressionLibFile}; the build must not resolve this library from elsewhere")
        }
    }
}

def verifyPackagedExpressionLib = tasks.register('verifyPackagedExpressionLib') {
    description = 'Checks the packaged mod jar nests exactly one library and those bytes are the pinned ones.'
    group = 'verification'
    def jarTask = tasks.named('jar', Jar)
    dependsOn jarTask
    inputs.file(jarTask.flatMap { it.archiveFile })
    doLast {
        File packaged = jarTask.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(packaged).withCloseable { archive ->
            List<String> names = archive.entries().collect { it.name }
            [expressionLibMetadataPath, expressionLibNestedPath].each { required ->
                int count = names.count { it == required }
                if (count != 1) {
                    throw new GradleException("${required} must appear exactly once in ${packaged.name}, found ${count}")
                }
            }
            List<String> nested = names.findAll { it.startsWith('META-INF/jarjar/') && it.endsWith('.jar') }.sort()
            if (nested != [expressionLibNestedPath]) {
                throw new GradleException("exactly one nested JAR ${expressionLibNestedPath} is allowed, found ${nested}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry(expressionLibMetadataPath)))
            if (!(metadata.jars instanceof List) || metadata.jars.size() != 1) {
                throw new GradleException('JarJar metadata must contain exactly one nested library entry')
            }
            def entry = metadata.jars[0]
            def identifier = entry.identifier ?: [:]
            def libraryVersion = entry.version ?: [:]
            if (identifier.group != expressionLibGroup || identifier.artifact != expressionLibArtifact) {
                throw new GradleException("JarJar identity must be ${expressionLibNotation}, got ${identifier}")
            }
            if (libraryVersion.range != expressionLibRange || libraryVersion.artifactVersion != expressionLibVersion) {
                throw new GradleException("JarJar version must be range ${expressionLibRange} / ${expressionLibVersion}, " +
                        "got ${libraryVersion}")
            }
            if (entry.path != expressionLibNestedPath) {
                throw new GradleException("JarJar path must be ${expressionLibNestedPath}, got ${entry.path}")
            }
            byte[] nestedBytes = archive.getInputStream(archive.getEntry(expressionLibNestedPath)).bytes
            if (nestedBytes.length != expressionLibBytes || sha256Hex(nestedBytes) != expressionLibSha256) {
                throw new GradleException("nested ${expressionLibNestedPath} is not the pinned build " +
                        "(${nestedBytes.length} bytes, sha256 ${sha256Hex(nestedBytes)})")
            }
            new java.util.zip.ZipInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nestedJar ->
                Map<String, String> descriptors = [:]
                for (def entryStream = nestedJar.nextEntry; entryStream != null; entryStream = nestedJar.nextEntry) {
                    if (expressionLibDescriptors.contains(entryStream.name)) {
                        ByteArrayOutputStream text = new ByteArrayOutputStream()
                        byte[] chunk = new byte[8192]
                        for (int read = nestedJar.read(chunk); read > 0; read = nestedJar.read(chunk)) {
                            text.write(chunk, 0, read)
                        }
                        descriptors[entryStream.name] = text.toString('UTF-8')
                    }
                }
                expressionLibDescriptors.each { descriptor ->
                    String text = descriptors[descriptor]
                    if (text == null) {
                        throw new GradleException("nested library is missing ${descriptor}")
                    }
                    [modId: expressionLibModId, version: expressionLibVersion, license: expressionLibLicense].each { key, value ->
                        if (!text.contains("${key}=\"${value}\"")) {
                            throw new GradleException("nested ${descriptor} does not declare ${key}=\"${value}\"")
                        }
                    }
                }
            }
        }
    }
}

tasks.named('check') { dependsOn verifyExpressionLibResolution }
tasks.named('build') { dependsOn verifyPackagedExpressionLib }
