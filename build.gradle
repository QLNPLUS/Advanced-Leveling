plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
    id 'idea'
}

version = fabric_version
group = mod_group_id
base { archivesName = "AdvancedLeveling-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.setSrcDirs(['src/main/java'])
sourceSets.main.java.include('daripher/autoleveling/FabricAutoLevelingMod.java')
sourceSets.main.java.include('daripher/autoleveling/FabricLevelingHooks.java')
sourceSets.main.java.include('daripher/autoleveling/LevelHolder.java')
sourceSets.main.java.include('daripher/autoleveling/MobListToolItem.java')
sourceSets.main.java.include('daripher/autoleveling/config/**')
sourceSets.main.java.include('daripher/autoleveling/mixin/LivingEntityMixin.java')
sourceSets.main.resources.exclude('META-INF/mods.toml')

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = rootProject.file('libs/maven') }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.1')
    include(expressionLib)
}

loom {
    mixin {
        defaultRefmapName = 'autoleveling.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_description': mod_description
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF/licenses/advanced-leveling'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('licenses/YiRanExpressionLib-LICENSE.txt')) {
        into 'META-INF/licenses/yiran-expression-lib'
    }
}
